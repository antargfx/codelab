<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Attendance · Attendance System</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/print.css" media="print" />
  </head>
  <body>
    <div id="app-shell"></div>

    <main>
      <div class="page-head">
        <h2 class="page-title-lg">Take Attendance</h2>
      </div>

      <section class="toolbar card">
        <label class="field inline">
          <span class="field-label">Batch</span>
          <select id="batch-select" aria-label="Select batch"></select>
        </label>
        <label class="field inline">
          <span class="field-label">Lab</span>
          <select id="lab-select" aria-label="Select lab"></select>
        </label>
        <label class="field inline">
          <span class="field-label">Date</span>
          <input type="date" id="date-input" aria-label="Select date" />
        </label>

        <label class="checkbox-row holiday-toggle">
          <input type="checkbox" id="holiday-toggle" />
          <span>Mark as Holiday / No Class</span>
        </label>

        <div class="toolbar-spacer"></div>

        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search name or roll…"
          aria-label="Search students"
        />
      </section>

      <section class="totals-bar card" id="totals-bar" aria-live="polite"></section>

      <section class="card table-card">
        <div class="table-wrapper">
          <table class="data-table attendance-table" id="attendance-table">
            <thead>
              <tr>
                <th scope="col">Roll</th>
                <th scope="col">Name</th>
                <th scope="col">Phone</th>
                <th scope="col" class="status-col">Status</th>
              </tr>
            </thead>
            <tbody id="attendance-body">
              <tr>
                <td colspan="4" class="cell-muted">Select a batch and lab…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="js/attendance.js"></script>
  </body>
</html>
