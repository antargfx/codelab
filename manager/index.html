<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub File Manager</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0f172a;
  color: white;
  padding: 20px;
}

.container {
  max-width: 1000px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 18px;
}

h1 {
  margin-bottom: 25px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.section {
  background: #0f172a;
  padding: 20px;
  border-radius: 16px;
}

.field {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #334155;
  color: white;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1d4ed8;
}

.full-btn {
  width: 100%;
}

.folder-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 10px;
  gap: 10px;
}

.delete-btn {
  background: #dc2626;
}

.delete-btn:hover {
  background: #b91c1c;
}

.status {
  margin-top: 20px;
  background: #020617;
  padding: 15px;
  border-radius: 12px;
  min-height: 120px;
  max-height: 250px;
  overflow: auto;
}

.success { color: #22c55e; }
.error { color: #ef4444; }
.info { color: #38bdf8; }

@media(max-width: 768px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="container">
  <h1>GitHub Repo File Manager</h1>

  <div class="grid">

    <div class="section">
      <h2 style="margin-bottom:20px;">Upload Files</h2>

      <div class="field">
        <label>GitHub Username</label>
        <input id="username" value="antargfx">
      </div>

      <div class="field">
        <label>Repository Name</label>
        <input id="repo" value="code Lab">
      </div>

      <div class="field">
        <label>Branch</label>
        <input id="branch" value="main">
      </div>

      <div class="field">
        <label>Folder Name</label>
        <input id="folder" placeholder="example-folder">
      </div>

      <div class="field">
        <label>Select Files</label>
        <input type="file" id="files" multiple>
      </div>

      <button class="full-btn" id="uploadBtn">Upload Files</button>
    </div>

    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>Folders</h2>
        <button onclick="loadFolders()">Refresh</button>
      </div>

      <div id="folders"></div>
    </div>

  </div>

  <div class="status" id="status"></div>

</div>

<script>
const TOKEN = "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";

const statusBox = document.getElementById("status");

function log(message, type="info") {
  const div = document.createElement("div");
  div.className = type;
  div.textContent = message;
  statusBox.appendChild(div);
  statusBox.scrollTop = statusBox.scrollHeight;
}

function getConfig() {
  return {
    username: document.getElementById("username").value.trim(),
    repo: document.getElementById("repo").value.trim(),
    branch: document.getElementById("branch").value.trim()
  };
}

async function githubRequest(url, options={}) {
  const response = await fetch(url, {
    ...options,
    headers: {
      Authorization: `token ${TOKEN}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.message || "GitHub API error");
  }

  return data;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

async function uploadFile(file, folder) {
  const { username, repo, branch } = getConfig();

  const content = await toBase64(file);

  const path = folder
    ? `${folder}/${file.name}`
    : file.name;

  const url = `https://api.github.com/repos/${username}/${repo}/contents/${encodeURIComponent(path)}`;

  await githubRequest(url, {
    method: "PUT",
    body: JSON.stringify({
      message: `Upload ${file.name}`,
      content,
      branch
    })
  });
}

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const folder = document.getElementById("folder").value.trim();
  const files = document.getElementById("files").files;

  if (!files.length) {
    log("Select files first", "error");
    return;
  }

  try {
    log(`Uploading ${files.length} file(s)...`);

    for (const file of files) {
      await uploadFile(file, folder);
      log(`${file.name} uploaded`, "success");
    }

    log("Upload completed", "success");

    loadFolders();

  } catch (err) {
    log(err.message, "error");
  }
});

async function loadFolders() {
  try {
    const { username, repo } = getConfig();

    const url = `https://api.github.com/repos/${username}/${repo}/contents`;

    const data = await githubRequest(url);

    const folders = data.filter(item => item.type === "dir");

    const container = document.getElementById("folders");

    container.innerHTML = "";

    if (!folders.length) {
      container.innerHTML = "<p>No folders found</p>";
      return;
    }

    folders.forEach(folder => {
      const div = document.createElement("div");
      div.className = "folder-item";

      div.innerHTML = `
        <span>${folder.name}</span>
        <button class="delete-btn" onclick="deleteFolder('${folder.name}')">
          Delete
        </button>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    log(err.message, "error");
  }
}

async function getFolderFiles(folderName) {
  const { username, repo } = getConfig();

  const url = `https://api.github.com/repos/${username}/${repo}/contents/${folderName}`;

  return await githubRequest(url);
}

async function deleteFolder(folderName) {
  const confirmDelete = confirm(`Delete folder "${folderName}" and all files?`);

  if (!confirmDelete) return;

  try {
    const { username, repo, branch } = getConfig();

    const files = await getFolderFiles(folderName);

    for (const file of files) {

      if (file.type !== "file") continue;

      const url = `https://api.github.com/repos/${username}/${repo}/contents/${folderName}/${file.name}`;

      await githubRequest(url, {
        method: "DELETE",
        body: JSON.stringify({
          message: `Delete ${file.name}`,
          sha: file.sha,
          branch
        })
      });

      log(`Deleted ${file.name}`, "success");
    }

    log(`Folder "${folderName}" deleted`, "success");

    loadFolders();

  } catch (err) {
    log(err.message, "error");
  }
}

loadFolders();
</script>

</body>
</html>
