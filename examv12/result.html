<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ExamPrep — Browse exam results by subject, or find your own scores" />
  <title>ExamPrep — Results</title>
  <link rel="stylesheet" href="result.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <!-- Theme Toggle -->
  <div class="theme-toggle-bar">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark mode">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
  </div>

  <div class="results-page">

    <header class="results-header">
      <i class="fa-solid fa-trophy brand-icon"></i>
      <h1 class="brand-title">Exam Results</h1>
      <p class="brand-sub">Browse results by subject, or look up your own scores</p>
      <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Exam Portal</a>
    </header>

    <!-- Mode switch -->
    <div class="mode-tabs">
      <button class="mode-tab active" id="modeTabBrowse" onclick="switchMode('browse')">
        <i class="fa-solid fa-list-ul"></i> Browse Exams
      </button>
      <button class="mode-tab" id="modeTabSearch" onclick="switchMode('search')">
        <i class="fa-solid fa-magnifying-glass"></i> Find My Results
      </button>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         BROWSE MODE — exam sessions grouped by subject + date
    ══════════════════════════════════════════════════════════ -->
    <div id="browsePanel" class="mode-panel active">

      <div id="sessionBackRow" style="display:none;margin-bottom:14px;">
        <button class="btn btn-outline" onclick="closeSessionDetail()">
          <i class="fa-solid fa-arrow-left"></i> Back to all exams
        </button>
      </div>

      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="browseSearch" placeholder="Search by subject or date…" oninput="filterBrowseView()" />
      </div>

      <p class="record-count" id="sessionCount">Loading…</p>

      <div id="sessionsContainer">
        <div class="empty-row"><div class="spinner"></div> Loading exams…</div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         SEARCH MODE — look up results by mobile number
    ══════════════════════════════════════════════════════════ -->
    <div id="searchPanel" class="mode-panel">

      <div class="lookup-card">
        <label for="lookupMobile">Enter your registered mobile number</label>
        <div class="lookup-input-row">
          <div class="lookup-input-wrapper">
            <i class="fa-solid fa-mobile-screen"></i>
            <input type="tel" id="lookupMobile" placeholder="e.g. 01712345678" maxlength="15" />
          </div>
          <button class="btn btn-primary" onclick="searchMyResults()">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </button>
        </div>
        <span class="field-error" id="lookupError"></span>
      </div>

      <div id="myResultsContainer"></div>
    </div>

  </div>

  <!-- Firebase SDK (compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="config.js"></script>
  <script src="firebase.js"></script>
  <script src="result.js"></script>
</body>
</html>
