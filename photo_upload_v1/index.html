<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Photos</title>

    <meta
        name="description"
        content="Upload your photos directly to Google Drive."
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2ff
                );

            color: #111827;

            display: flex;

            justify-content: center;

            padding: 30px 16px;

        }


        .container {

            width: 100%;

            max-width: 850px;

        }


        .card {

            background: rgba(255,255,255,.96);

            border: 1px solid #e5e7eb;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 20px 60px rgba(15,23,42,.10);

        }


        .header {

            text-align: center;

            margin-bottom: 25px;

        }


        .header-icon {

            width: 68px;

            height: 68px;

            margin: 0 auto 16px;

            border-radius: 20px;

            background: #4f46e5;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

        }


        h1 {

            margin: 0;

            font-size: 30px;

            letter-spacing: -.5px;

        }


        .subtitle {

            margin: 10px 0 0;

            color: #6b7280;

            line-height: 1.6;

        }


        .drop-zone {

            border: 2px dashed #c7d2fe;

            background: #f8faff;

            border-radius: 20px;

            padding: 45px 20px;

            text-align: center;

            cursor: pointer;

            transition: .2s ease;

        }


        .drop-zone:hover,
        .drop-zone.dragging {

            border-color: #4f46e5;

            background: #eef2ff;

        }


        .drop-icon {

            font-size: 45px;

            margin-bottom: 12px;

        }


        .drop-title {

            font-size: 18px;

            font-weight: 700;

        }


        .drop-description {

            margin-top: 7px;

            color: #6b7280;

            font-size: 14px;

        }


        #fileInput {

            display: none;

        }


        .stats {

            display: none;

            margin-top: 20px;

            padding: 16px;

            border-radius: 14px;

            background: #f9fafb;

            border: 1px solid #e5e7eb;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

        }


        .stat {

            text-align: center;

        }


        .stat-number {

            font-size: 20px;

            font-weight: 800;

        }


        .stat-label {

            font-size: 12px;

            color: #6b7280;

            margin-top: 3px;

        }


        .actions {

            display: none;

            gap: 10px;

            margin-top: 20px;

        }


        button {

            border: 0;

            cursor: pointer;

            border-radius: 12px;

            padding: 13px 18px;

            font-size: 14px;

            font-weight: 700;

        }


        .upload-button {

            flex: 1;

            background: #4f46e5;

            color: white;

        }


        .upload-button:hover {

            background: #4338ca;

        }


        .clear-button {

            background: #f3f4f6;

            color: #374151;

        }


        .files {

            margin-top: 25px;

            display: none;

        }


        .file-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .file-item {

            display: grid;

            grid-template-columns:
                50px 1fr auto;

            align-items: center;

            gap: 12px;

            padding: 10px;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            background: white;

        }


        .thumbnail {

            width: 50px;

            height: 50px;

            border-radius: 10px;

            object-fit: cover;

            background: #f3f4f6;

        }


        .file-name {

            font-size: 14px;

            font-weight: 600;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .file-size {

            font-size: 12px;

            color: #6b7280;

            margin-top: 3px;

        }


        .file-status {

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

        }


        .waiting {
            color: #6b7280;
        }

        .uploading {
            color: #4f46e5;
        }

        .success {
            color: #059669;
        }

        .error {
            color: #dc2626;
        }


        .progress {

            height: 5px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;

            margin-top: 7px;

        }


        .progress-bar {

            width: 0%;

            height: 100%;

            background: #4f46e5;

            transition: width .15s linear;

        }


        .overall {

            display: none;

            margin-top: 25px;

        }


        .overall-top {

            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 700;

        }


        .overall-progress {

            height: 8px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;

        }


        .overall-bar {

            width: 0%;

            height: 100%;

            background: #4f46e5;

            transition: width .2s ease;

        }


        .message {

            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            font-size: 14px;

            line-height: 1.5;

        }


        .message.success-message {

            background: #ecfdf5;

            color: #065f46;

        }


        .message.error-message {

            background: #fef2f2;

            color: #991b1b;

        }


        .footer {

            text-align: center;

            color: #9ca3af;

            font-size: 12px;

            margin-top: 18px;

        }


        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 25px;
            }

            .drop-zone {
                padding: 35px 15px;
            }

            .stats {
                grid-template-columns:
                    1fr 1fr 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .file-item {
                grid-template-columns:
                    45px 1fr;
            }

            .file-status {
                grid-column: 2;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="header-icon">
                ↑
            </div>

            <h1>
                Upload Your Photos
            </h1>

            <p class="subtitle">
                Select multiple photos and upload
                them directly to our Google Drive.
            </p>

        </div>


        <div
            class="drop-zone"
            id="dropZone"
        >

            <div class="drop-icon">
                📷
            </div>

            <div class="drop-title">
                Select Photos
            </div>

            <div class="drop-description">
                Click here or drag & drop photos
            </div>

            <div class="drop-description">
                Original quality is preserved
            </div>

        </div>


        <input
            id="fileInput"
            type="file"
            multiple
            accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/gif"
        >


        <div
            class="stats"
            id="stats"
        >

            <div class="stat">

                <div
                    class="stat-number"
                    id="fileCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Photos
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="totalSize"
                >
                    0 MB
                </div>

                <div class="stat-label">
                    Total size
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="uploadedCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Uploaded
                </div>

            </div>

        </div>


        <div
            class="actions"
            id="actions"
        >

            <button
                class="upload-button"
                id="uploadButton"
            >
                Upload All Photos
            </button>

            <button
                class="clear-button"
                id="clearButton"
            >
                Clear
            </button>

        </div>


        <div
            class="overall"
            id="overall"
        >

            <div class="overall-top">

                <span>
                    Overall progress
                </span>

                <span id="overallPercent">
                    0%
                </span>

            </div>

            <div class="overall-progress">

                <div
                    class="overall-bar"
                    id="overallBar"
                ></div>

            </div>

        </div>


        <div
            class="files"
            id="files"
        >

            <div
                class="file-list"
                id="fileList"
            ></div>

        </div>


        <div
            class="message"
            id="message"
        ></div>


        <div class="footer">
            Files are uploaded in their original quality.
        </div>

    </div>

</div>


<script>

/*
 * ==========================================================
 * IMPORTANT
 * ==========================================================
 *
 * Paste your Google Apps Script Web App URL here.
 *
 * Example:
 *
 * https://script.google.com/macros/s/XXXXX/exec
 *
 */

const UPLOAD_ENDPOINT =
    "https://script.google.com/macros/s/AKfycbxLweYExbKHCU2kHbzQVaCW0bHZGmongDqbwK3W7NQ9IV_OTWliL6htShzPFKYCtC20wQ/exec";


/*
 * Settings
 */

const MAX_FILE_SIZE =
    45 * 1024 * 1024;

const MAX_FILES =
    100;


/*
 * DOM
 */

const dropZone =
    document.getElementById("dropZone");

const fileInput =
    document.getElementById("fileInput");

const stats =
    document.getElementById("stats");

const actions =
    document.getElementById("actions");

const uploadButton =
    document.getElementById("uploadButton");

const clearButton =
    document.getElementById("clearButton");

const filesContainer =
    document.getElementById("files");

const fileList =
    document.getElementById("fileList");

const fileCount =
    document.getElementById("fileCount");

const totalSize =
    document.getElementById("totalSize");

const uploadedCount =
    document.getElementById("uploadedCount");

const overall =
    document.getElementById("overall");

const overallBar =
    document.getElementById("overallBar");

const overallPercent =
    document.getElementById("overallPercent");

const message =
    document.getElementById("message");


/*
 * State
 */

let selectedFiles = [];

let uploading = false;


/*
 * Open file picker.
 */

dropZone.addEventListener(
    "click",
    () => fileInput.click()
);


/*
 * File selection.
 */

fileInput.addEventListener(
    "change",
    event => {

        addFiles(
            Array.from(event.target.files)
        );

        fileInput.value = "";

    }
);


/*
 * Drag & drop.
 */

dropZone.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropZone.classList.add("dragging");

    }
);


dropZone.addEventListener(
    "dragleave",
    () => {

        dropZone.classList.remove("dragging");

    }
);


dropZone.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropZone.classList.remove("dragging");

        addFiles(
            Array.from(event.dataTransfer.files)
        );

    }
);


/*
 * Add files.
 */

function addFiles(files) {

    if (uploading) {
        return;
    }


    if (
        selectedFiles.length +
        files.length >
        MAX_FILES
    ) {

        showMessage(
            `Maximum ${MAX_FILES} files allowed per batch.`,
            "error"
        );

        return;

    }


    const validFiles = [];


    for (const file of files) {

        if (!file.type.startsWith("image/")) {

            continue;

        }


        if (file.size > MAX_FILE_SIZE) {

            showMessage(
                `${file.name} is larger than 45 MB and was skipped.`,
                "error"
            );

            continue;

        }


        validFiles.push(file);

    }


    selectedFiles.push(...validFiles);

    renderFiles();

}


/*
 * Render file list.
 */

function renderFiles() {

    fileList.innerHTML = "";

    let size = 0;


    selectedFiles.forEach(
        (file, index) => {

            size += file.size;


            const item =
                document.createElement("div");

            item.className =
                "file-item";

            item.dataset.index =
                index;


            const img =
                document.createElement("img");

            img.className =
                "thumbnail";


            /*
             * Browser creates local preview.
             */

            img.src =
                URL.createObjectURL(file);


            const info =
                document.createElement("div");


            const name =
                document.createElement("div");

            name.className =
                "file-name";

            name.textContent =
                file.name;


            const sizeText =
                document.createElement("div");

            sizeText.className =
                "file-size";

            sizeText.textContent =
                formatBytes(file.size);


            const progress =
                document.createElement("div");

            progress.className =
                "progress";


            const progressBar =
                document.createElement("div");

            progressBar.className =
                "progress-bar";


            progress.appendChild(
                progressBar
            );


            info.appendChild(name);

            info.appendChild(sizeText);

            info.appendChild(progress);


            const status =
                document.createElement("div");

            status.className =
                "file-status waiting";

            status.textContent =
                "Waiting";


            item.appendChild(img);

            item.appendChild(info);

            item.appendChild(status);


            fileList.appendChild(item);

        }
    );


    fileCount.textContent =
        selectedFiles.length;

    totalSize.textContent =
        formatBytes(size);


    uploadedCount.textContent =
        "0";


    if (selectedFiles.length > 0) {

        stats.style.display =
            "grid";

        actions.style.display =
            "flex";

        filesContainer.style.display =
            "block";

        overall.style.display =
            "none";

    } else {

        stats.style.display =
            "none";

        actions.style.display =
            "none";

        filesContainer.style.display =
            "none";

    }

}


/*
 * Upload button.
 */

uploadButton.addEventListener(
    "click",
    uploadAll
);


/*
 * Clear button.
 */

clearButton.addEventListener(
    "click",
    () => {

        if (uploading) {
            return;
        }

        selectedFiles = [];

        renderFiles();

        hideMessage();

    }
);


/*
 * Upload all.
 *
 * Files are uploaded one at a time.
 *
 * This is intentional:
 *
 * - reduces memory pressure
 * - avoids hammering Apps Script
 * - easier to recover failed uploads
 */

async function uploadAll() {

    if (uploading) {
        return;
    }


    if (
        UPLOAD_ENDPOINT.includes(
            "PASTE_YOUR"
        )
    ) {

        showMessage(
            "Please add your Apps Script Web App URL to script.js first.",
            "error"
        );

        return;

    }


    if (
        selectedFiles.length === 0
    ) {

        return;

    }


    uploading = true;

    uploadButton.disabled = true;

    clearButton.disabled = true;

    uploadButton.textContent =
        "Uploading...";


    overall.style.display =
        "block";


    let uploaded = 0;


    for (
        let i = 0;
        i < selectedFiles.length;
        i++
    ) {

        const file =
            selectedFiles[i];


        try {

            await uploadFile(
                file,
                i,
                percent => {

                    updateFileProgress(
                        i,
                        percent
                    );


                    /*
                     * Overall progress
                     */

                    const overallProgress =
                        (
                            (uploaded + percent / 100)
                            /
                            selectedFiles.length
                        ) * 100;


                    setOverallProgress(
                        overallProgress
                    );

                }
            );


            uploaded++;


            uploadedCount.textContent =
                uploaded;


            updateFileProgress(
                i,
                100,
                true
            );


            setOverallProgress(
                (uploaded /
                    selectedFiles.length) *
                    100
            );


        } catch (error) {

            console.error(error);


            updateFileError(
                i,
                error.message
            );

        }

    }


    uploading = false;

    uploadButton.disabled = false;

    clearButton.disabled = false;

    uploadButton.textContent =
        "Upload All Photos";


    if (
        uploaded ===
        selectedFiles.length
    ) {

        showMessage(
            `Successfully uploaded ${uploaded} photo${uploaded === 1 ? "" : "s"} to Google Drive.`,
            "success"
        );

    } else {

        showMessage(
            `${uploaded} of ${selectedFiles.length} photos uploaded successfully. Failed uploads are marked below.`,
            "error"
        );

    }

}


/*
 * Upload one file.
 *
 * XMLHttpRequest is used instead of fetch
 * because it provides upload progress events.
 */

function uploadFile(
    file,
    index,
    onProgress
) {

    return new Promise(
        (resolve, reject) => {

            setFileStatus(
                index,
                "Uploading...",
                "uploading"
            );


            /*
             * Convert original file to Base64.
             *
             * IMPORTANT:
             *
             * Base64 does NOT compress or resize
             * the image.
             *
             * The binary bytes are preserved.
             */

            const reader =
                new FileReader();


            reader.onload =
                function () {

                    const result =
                        reader.result;


                    const base64 =
                        result.split(",")[1];


                    const xhr =
                        new XMLHttpRequest();


                    xhr.open(
                        "POST",
                        UPLOAD_ENDPOINT,
                        true
                    );


                    xhr.upload.onprogress =
                        function (event) {

                            if (
                                event.lengthComputable
                            ) {

                                const percent =
                                    (
                                        event.loaded /
                                        event.total
                                    ) * 100;


                                onProgress(
                                    percent
                                );

                            }

                        };


                    xhr.onload =
                        function () {

                            if (
                                xhr.status < 200 ||
                                xhr.status >= 300
                            ) {

                                reject(
                                    new Error(
                                        "Server returned HTTP " +
                                        xhr.status
                                    )
                                );

                                return;

                            }


                            try {

                                const response =
                                    JSON.parse(
                                        xhr.responseText
                                    );


                                if (
                                    !response.success
                                ) {

                                    reject(
                                        new Error(
                                            response.error ||
                                            "Upload failed."
                                        )
                                    );

                                    return;

                                }


                                resolve(response);

                            } catch (error) {

                                reject(
                                    new Error(
                                        "Invalid server response."
                                    )
                                );

                            }

                        };


                    xhr.onerror =
                        function () {

                            reject(
                                new Error(
                                    "Network error. Please try again."
                                )
                            );

                        };


                    xhr.ontimeout =
                        function () {

                            reject(
                                new Error(
                                    "Upload timed out."
                                )
                            );

                        };


                    /*
                     * Use URL-encoded form data.
                     */

                    const formData =
                        new URLSearchParams();


                    formData.append(
                        "name",
                        file.name
                    );


                    formData.append(
                        "mimeType",
                        file.type ||
                        "application/octet-stream"
                    );


                    formData.append(
                        "data",
                        base64
                    );


                    xhr.setRequestHeader(
                        "Content-Type",
                        "application/x-www-form-urlencoded;charset=UTF-8"
                    );


                    xhr.send(
                        formData.toString()
                    );

                };


            reader.onerror =
                function () {

                    reject(
                        new Error(
                            "Could not read file."
                        )
                    );

                };


            /*
             * Read original file.
             */

            reader.readAsDataURL(file);

        }
    );

}


/*
 * Update individual progress.
 */

function updateFileProgress(
    index,
    percent,
    completed = false
) {

    const item =
        fileList.children[index];

    if (!item) {
        return;
    }


    const bar =
        item.querySelector(
            ".progress-bar"
        );


    const status =
        item.querySelector(
            ".file-status"
        );


    bar.style.width =
        percent + "%";


    if (completed) {

        status.className =
            "file-status success";

        status.textContent =
            "✓ Uploaded";

    } else {

        status.className =
            "file-status uploading";

        status.textContent =
            Math.round(percent) +
            "%";

    }

}


/*
 * Error status.
 */

function updateFileError(
    index,
    error
) {

    const item =
        fileList.children[index];

    if (!item) {
        return;
    }


    const status =
        item.querySelector(
            ".file-status"
        );


    status.className =
        "file-status error";

    status.textContent =
        "✕ Failed";


    status.title =
        error || "Upload failed.";

}


/*
 * Simple status setter.
 */

function setFileStatus(
    index,
    text,
    className
) {

    const item =
        fileList.children[index];

    if (!item) {
        return;
    }


    const status =
        item.querySelector(
            ".file-status"
        );


    status.className =
        "file-status " +
        className;

    status.textContent =
        text;

}


/*
 * Overall progress.
 */

function setOverallProgress(
    percent
) {

    percent =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );


    overallBar.style.width =
        percent + "%";


    overallPercent.textContent =
        Math.round(percent) + "%";

}


/*
 * Messages.
 */

function showMessage(
    text,
    type
) {

    message.style.display =
        "block";

    message.className =
        "message " +
        (
            type === "success"
                ? "success-message"
                : "error-message"
        );

    message.textContent =
        text;

}


function hideMessage() {

    message.style.display =
        "none";

}


/*
 * Format bytes.
 */

function formatBytes(
    bytes
) {

    if (bytes === 0) {
        return "0 Bytes";
    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        parseFloat(
            (
                bytes /
                Math.pow(
                    1024,
                    i
                )
            ).toFixed(2)
        )
        +
        " "
        +
        units[i]
    );

}

</script>

</body>

</html>
