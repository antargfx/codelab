<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YouTube Lite</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--yt-red:#ff0000;--bg:#0f0f0f;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,Roboto,Arial,sans-serif;
  }
  .splash{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;}
  .logo{width:88px;height:88px;}
  .logo svg{width:100%;height:100%;display:block;}
  .spinner{
    width:34px;height:34px;border:3px solid rgba(255,255,255,0.15);
    border-top-color:var(--yt-red);border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .label{color:#fff;font-size:14px;letter-spacing:.3px;opacity:.85;}
  .err{
    color:#aaa;font-size:13px;text-align:center;max-width:280px;
    line-height:1.6;display:none;
  }
  .err a{color:#3ea6ff;text-decoration:none;}
  .err a:active{opacity:.7;}
</style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
        <rect width="90" height="90" rx="20" fill="#FF0000"/>
        <polygon points="34,24 68,45 34,66" fill="#fff"/>
      </svg>
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="label" id="label">Opening YouTube…</div>
    <div class="err" id="err">
      Couldn't open automatically (no connection?).<br>
      <a href="https://www.youtube.com/" id="manualLink">Tap here to open YouTube</a>
    </div>
  </div>

<script>
  // Register service worker: enables "Add to Home Screen" + offline splash.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  var DEST = 'https://www.youtube.com/';

  function goToYouTube() {
    // Plain browser navigation reuses Chrome's existing cookies/session.
    // If you're already signed into your Google account in Chrome,
    // YouTube will load already signed in — no extra login step needed.
    window.location.replace(DEST);
  }

  // Small delay so this actually reads as an "app launching" instead of a flash.
  var launchTimer = setTimeout(goToYouTube, 450);

  // If we're offline or the redirect gets blocked, don't leave the user
  // staring at a spinner forever — show a manual link after 3s.
  setTimeout(function () {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('label').textContent = 'Still here?';
    document.getElementById('err').style.display = 'block';
  }, 3000);

  // If the page becomes visible again (user backed out of YouTube back into
  // this launcher), don't auto-redirect a second time — let them tap manually.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      clearTimeout(launchTimer);
    }
  });
</script>
</body>
</html>
