<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antar's Projects</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0d1117;
  color:white;
  font-family:Arial,sans-serif;
  padding:40px;
}

h1{
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:16px;
  padding:20px;
  text-decoration:none;
  color:white;
  transition:.2s;
  overflow:hidden;
  word-break:break-word;
}

.card:hover{
  border-color:#58a6ff;
  transform:translateY(-3px);
}

.card h2{
  margin-top:0;
  margin-bottom:14px;
}

.card p{
  margin:0;
  opacity:.8;
  line-height:1.4;
}
</style>
</head>
<body>

<h1>Antar's Projects</h1>

<div class="grid" id="projects"></div>

<script>
const username = "antargfx";
const repo = "codelab";

async function loadProjects(){

  const container = document.getElementById("projects");

  try{

    const response = await fetch(
      `https://api.github.com/repos/${username}/${repo}/contents`
    );

    const data = await response.json();

    const folders = data
      .filter(item => item.type === "dir")
      .sort((a, b) =>
        a.name.localeCompare(b.name, undefined, {
          numeric: true,
          sensitivity: "base"
        })
      );

    for(const item of folders){

      try{

        const folderResponse = await fetch(
          `https://api.github.com/repos/${username}/${repo}/contents/${item.name}`
        );

        const folderData = await folderResponse.json();

        const hasIndex = folderData.some(file =>
          file.name.toLowerCase() === "index.html"
        );

        if(hasIndex){

          const projectUrl =
            `https://${username}.github.io/${repo}/${item.name}`;

          const card = document.createElement("a");

          card.className = "card";
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.href = projectUrl;

          card.innerHTML = `
            <h2>${item.name}</h2>
            <p>${projectUrl}</p>
          `;

          container.appendChild(card);

        }

      }catch(error){
        console.error("Folder error:", item.name, error);
      }

    }

  }catch(error){

    container.innerHTML = `
      <p>Failed to load projects.</p>
    `;

    console.error(error);

  }

}

loadProjects();
</script>

</body>
</html>
