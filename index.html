<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antar's Projects</title>

<style>
body{
  background:#0d1117;
  color:white;
  font-family:Arial,sans-serif;
  padding:40px;
}

h1{
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:16px;
  padding:20px;
  text-decoration:none;
  color:white;
  transition:.2s;

  overflow:hidden;
  word-break:break-word;
}

.card:hover{
  border-color:#58a6ff;
  transform:translateY(-3px);
}
</style>
</head>
<body>

<h1>Antar's Projects</h1>

<div class="grid" id="projects"></div>

<script>
const username = "antargfx";
const repo = "codelab";

async function loadProjects() {
  const container = document.getElementById("projects");

  const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents`);
  const data = await res.json();

  const folders = data
    .filter(item => item.type === "dir");

  const validFolders = await Promise.all(
    folders.map(async (item) => {
      const r = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${item.name}`);
      const folderData = await r.json();

      const hasIndex = folderData.some(file =>
        file.name.toLowerCase() === "index.html"
      );

      return hasIndex ? item : null;
    })
  );

  validFolders
    .filter(Boolean)
    .sort((a, b) =>
      a.name.localeCompare(b.name, undefined, {
        numeric: true,
        sensitivity: "base"
      })
    )
    .forEach(item => {
      const card = document.createElement("a");

      card.className = "card";
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.href = `/codelab/${item.name}`;

      card.innerHTML = `
        <h2>${item.name}</h2>
        <p>https://${username}.github.io/codelab/${item.name}</p>
      `;

      container.appendChild(card);
    });
}

loadProjects().catch(err => {
  console.error(err);
  document.getElementById("projects").innerHTML = "<p>Failed to load projects.</p>";
});
</script>

</body>
</html>
