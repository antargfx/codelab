<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5a1f" />
  <title>Orbit IDE</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/editor.css" />
  <link rel="stylesheet" href="styles/inspector.css" />
  <link rel="stylesheet" href="styles/panels.css" />
</head>
<body>
  <!-- ============ TOP BAR ============ -->
  <header class="topbar" role="banner">
    <button class="icon-btn topbar__menu" id="btnToggleSidebar" aria-label="Toggle file explorer" title="Files">
      <svg viewBox="0 0 24 24" class="ico"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar__brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Orbit IDE</span>
    </div>
    <div class="topbar__actions">
      <button class="icon-btn" id="btnRun" aria-label="Run / Refresh preview" title="Run">
        <svg viewBox="0 0 24 24" class="ico"><path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="icon-btn" id="btnTogglePreview" aria-label="Toggle preview" title="Preview">
        <svg viewBox="0 0 24 24" class="ico"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" aria-label="Toggle color theme" title="Theme">
        <svg viewBox="0 0 24 24" class="ico"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="btnExport" aria-label="Export project as ZIP" title="Export ZIP">
        <svg viewBox="0 0 24 24" class="ico"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ WORKSPACE ============ -->
  <div class="workspace" id="workspace">
    <!-- SIDEBAR / FILE EXPLORER -->
    <aside class="sidebar" id="sidebar" aria-label="Explorer">
      <div class="sidebar__tabs" role="tablist">
        <button class="side-tab is-active" data-side="files" role="tab">Files</button>
        <button class="side-tab" data-side="search" role="tab">Search</button>
      </div>

      <section class="side-panel is-active" data-panel="files">
        <div class="explorer__toolbar">
          <button class="icon-btn sm" id="btnUploadFolder" title="Upload folder">
            <svg viewBox="0 0 24 24" class="ico"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><path d="M12 11v6M9 14l3-3 3 3"/></svg>
          </button>
          <button class="icon-btn sm" id="btnUploadFiles" title="Upload files">
            <svg viewBox="0 0 24 24" class="ico"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          </button>
          <button class="icon-btn sm" id="btnNewFile" title="New file">
            <svg viewBox="0 0 24 24" class="ico"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M12 11v6M9 14h6"/></svg>
          </button>
          <button class="icon-btn sm" id="btnNewFolder" title="New folder">
            <svg viewBox="0 0 24 24" class="ico"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><path d="M12 10v6M9 13h6"/></svg>
          </button>
          <button class="icon-btn sm" id="btnCollapseAll" title="Collapse all">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 9l8 0M4 15l8 0M18 6l-3 3 3 3"/></svg>
          </button>
        </div>
        <div class="explorer__filter">
          <input type="search" id="fileFilter" placeholder="Filter files…" aria-label="Filter files" />
        </div>
        <div class="file-tree" id="fileTree" role="tree" tabindex="0"></div>
        <div class="explorer__empty" id="explorerEmpty">
          <p>No project loaded.</p>
          <button class="btn primary" id="btnEmptyUpload">Upload a folder</button>
          <p class="hint">or drag &amp; drop files anywhere</p>
        </div>
      </section>

      <section class="side-panel" data-panel="search">
        <div class="search-pane" id="searchPane"></div>
      </section>
    </aside>

    <div class="resizer resizer--v" id="resizeSidebar" role="separator" aria-label="Resize sidebar"></div>

    <!-- MAIN: EDITOR + PREVIEW -->
    <main class="main" id="main">
      <div class="pane pane--editor" id="paneEditor">
        <div class="tabs" id="tabs" role="tablist"></div>
        <!-- editor toolbar injected here by main.js -->
        <div class="editor-stage" id="editorStage">
          <div class="editor-host" id="editorHost"></div>
          <div class="editor-empty" id="editorEmpty">
            <div class="editor-empty__logo">◐</div>
            <h2>Orbit IDE</h2>
            <p>A complete browser IDE. Upload a project to begin.</p>
          </div>
          <div class="image-host" id="imageHost" hidden></div>
          <div class="json-host" id="jsonHost" hidden></div>
        </div>
      </div>

      <div class="resizer resizer--v" id="resizeMain" role="separator" aria-label="Resize editor"></div>

      <div class="pane pane--preview" id="panePreview">
        <div class="preview__bar">
          <button class="icon-btn sm" id="btnPickElement" title="Element picker">
            <svg viewBox="0 0 24 24" class="ico"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51z"/></svg>
          </button>
          <div class="addressbar">
            <span class="addressbar__lock">⌂</span>
            <input id="previewUrl" class="addressbar__input" value="index.html" aria-label="Preview path" />
          </div>
          <button class="icon-btn sm" id="btnPreviewReload" title="Reload preview">
            <svg viewBox="0 0 24 24" class="ico"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
          <button class="icon-btn sm" id="btnPreviewExternal" title="Open in new tab">
            <svg viewBox="0 0 24 24" class="ico"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
          </button>
        </div>
        <div class="preview__stage" id="previewStage">
          <iframe id="previewFrame" class="preview__frame" title="Live preview"
            sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock"></iframe>
          <div class="preview__overlay" id="pickOverlay" hidden></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ BOTTOM DOCK (DevTools) ============ -->
  <div class="resizer resizer--h" id="resizeDock" role="separator" aria-label="Resize panel"></div>
  <section class="dock" id="dock" aria-label="Developer tools">
    <div class="dock__tabs" role="tablist" id="dockTabs">
      <button class="dock-tab is-active" data-dock="console" role="tab">Console <span class="badge" id="badgeConsole">0</span></button>
      <button class="dock-tab" data-dock="errors" role="tab">Errors <span class="badge danger" id="badgeErrors">0</span></button>
      <button class="dock-tab" data-dock="network" role="tab">Network <span class="badge" id="badgeNetwork">0</span></button>
      <button class="dock-tab" data-dock="inspector" role="tab">Inspector</button>
      <button class="dock-tab" data-dock="storage" role="tab">Storage</button>
      <div class="dock__spacer"></div>
      <button class="icon-btn sm" id="btnDockToggle" title="Collapse panel">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="dock__body">
      <div class="dock-panel is-active" data-panel="console" id="panelConsole"></div>
      <div class="dock-panel" data-panel="errors" id="panelErrors"></div>
      <div class="dock-panel" data-panel="network" id="panelNetwork"></div>
      <div class="dock-panel" data-panel="inspector" id="panelInspector"></div>
      <div class="dock-panel" data-panel="storage" id="panelStorage"></div>
    </div>
  </section>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav class="mobilenav" id="mobilenav" aria-label="Sections">
    <button class="mnav-btn is-active" data-view="files"><svg viewBox="0 0 24 24" class="ico"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg><span>Files</span></button>
    <button class="mnav-btn" data-view="editor"><svg viewBox="0 0 24 24" class="ico"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg><span>Editor</span></button>
    <button class="mnav-btn" data-view="preview"><svg viewBox="0 0 24 24" class="ico"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Preview</span></button>
    <button class="mnav-btn" data-view="devtools"><svg viewBox="0 0 24 24" class="ico"><path d="M4 17l6-6-6-6M12 19h8"/></svg><span>Tools</span></button>
  </nav>

  <!-- Context menu + bottom sheet host -->
  <div class="ctx-menu" id="ctxMenu" role="menu" hidden></div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="bottom-sheet" id="bottomSheet" hidden role="dialog" aria-modal="true"></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <!-- hidden inputs -->
  <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
  <input type="file" id="filesInput" multiple hidden />

  <script type="module" src="js/main.js"></script>
</body>
</html>
